<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户功能流程图</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      color: #000;
      font-family: "SimSun", "宋体", "Times New Roman", serif;
      font-size: 22pt;
      font-weight: 700;
      background: #fff;
    }
    body {
      padding: 28px 16px 40px;
    }
    h1 {
      text-align: center;
      font-size: 22pt;
      font-weight: 700;
      color: #000;
      margin: 0 0 24px;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
    }
    table.flow {
      margin: 0 auto;
      border-collapse: separate;
      border-spacing: 12px 8px;
    }
    table.flow td {
      vertical-align: middle;
      text-align: center;
      padding: 0;
    }
    .pill {
      display: inline-block;
      border: 2.5px solid #000;
      border-radius: 18px;
      padding: 14px 22px;
      background: #fff;
      color: #000;
      font-size: 22pt;
      font-weight: 700;
      white-space: nowrap;
    }
    .arr-h {
      font-size: 22pt;
      font-weight: 700;
      color: #000;
      padding: 0 4px;
    }
    /* 与「→」「↓」一致：文字箭头 + 细横线，无实心三角 */
    .conn-bridge-cell {
      padding: 2px 0 6px;
      vertical-align: middle;
    }
    .conn-step-down {
      text-align: right;
      padding-right: 8%;
    }
    .conn-h-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 92%;
      max-width: 880px;
      margin: 0 auto;
      gap: 0;
    }
    .conn-h-rule {
      flex: 1 1 auto;
      height: 0;
      border-top: 2px solid #000;
      min-width: 2em;
    }
    .conn-step-down2 {
      text-align: left;
      padding-left: 10%;
    }
    .arr-v {
      font-size: 22pt;
      line-height: 1.15;
      color: #000;
      font-weight: 700;
      padding: 2px 0 4px;
    }
  </style>
</head>
<body>
  <h1>用户功能流程图</h1>
  <div class="wrap">
    <table class="flow" role="presentation">
      <!-- 第 1 行：横向 -->
      <tr>
        <td><div class="pill">用户</div></td>
        <td class="arr-h" aria-hidden="true">→</td>
        <td><div class="pill">登录注册</div></td>
        <td class="arr-h" aria-hidden="true">→</td>
        <td><div class="pill">首页概览</div></td>
      </tr>
      <!-- 首页概览 → 数据分析：↓ + ←── + ↓（与 →、↓ 同为字符线风格） -->
      <tr>
        <td colspan="4"></td>
        <td class="conn-step-down"><span class="arr-v" aria-hidden="true">↓</span></td>
      </tr>
      <tr>
        <td colspan="5" class="conn-bridge-cell">
          <div class="conn-h-row">
            <span class="arr-h" aria-hidden="true">←</span>
            <div class="conn-h-rule" aria-hidden="true"></div>
          </div>
        </td>
      </tr>
      <tr>
        <td class="conn-step-down2"><span class="arr-v" aria-hidden="true">↓</span></td>
        <td colspan="4"></td>
      </tr>
      <!-- 第 2 行：横向 -->
      <tr>
        <td><div class="pill">数据分析</div></td>
        <td class="arr-h" aria-hidden="true">→</td>
        <td><div class="pill">风格聚类</div></td>
        <td class="arr-h" aria-hidden="true">→</td>
        <td><div class="pill">表现预测</div></td>
      </tr>
      <!-- 竖向：对齐在「表现预测」列下 -->
      <tr>
        <td colspan="4"></td>
        <td class="arr-v" aria-hidden="true">↓</td>
      </tr>
      <!-- 第 3 行：个人中心 -->
      <tr>
        <td colspan="4"></td>
        <td><div class="pill">个人中心</div></td>
      </tr>
    </table>
  </div>
</body>
</html>
